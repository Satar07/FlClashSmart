repos:
  - repo: local
    hooks:
      - id: model-asset-hash
        name: update model asset hash
        entry: tool/update_model_asset_hash.sh
        language: system
        files: assets/data/Model\.bin$
        pass_filenames: false
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
      - id: flutter-analyze
        name: flutter analyze (pre-push)
        entry: flutter analyze --no-fatal-infos
        language: system
        pass_filenames: false
        stages: [pre-push]
